name: sevaone

services:
  # wso2is itself lives in docker-compose.wso2is.yml (stock image, Postgres-backed). This file
  # only provisions the citizen-issuer JWT-bearer exchange app on it -- see wso2/provision.sh --
  # and expects wso2is already up on the shared sevaone-net network. Must run BEFORE bff starts,
  # since bff needs the clientId/clientSecret this produces.
  wso2is-provision:
    image: alpine:3.20
    volumes:
      - ./wso2/provision.sh:/provision.sh:ro
      - ./wso2/sevaone-citizen-issuer.crt:/citizen-issuer.crt:ro
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /provision.sh"]
    environment:
      IS_URL: https://wso2is:9443

  # wso2apim itself now lives in docker-compose.wso2apim.yml (stock image, Postgres-backed).
  # This file only provisions it (Key Manager registration + API import/publish), and expects
  # it already up on the shared sevaone-net network.
  wso2apim-provision:
    image: alpine:3.20
    depends_on:
      - bff
    volumes:
      - ./wso2-apim/provision.sh:/provision.sh:ro
    # postgresql-client (psql) backs provision.sh's self-heal for the WSO2 APIM index-vs-DB
    # persistence bug -- see the comment above import_api_with_self_heal in provision.sh.
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq python3 postgresql-client >/dev/null && sh /provision.sh"]
    environment:
      APIM_URL: https://wso2apim:9443
      IS_URL: https://wso2is:9443
      BFF_URL: http://bff:8080
      CITIZEN_GATEWAY_SECRET: FON2nsJHjslfJw66yYgUTIXKvDjic0KgIRajwAG0Yo
      DEPT_GATEWAY_SECRET: gm9t0ux0G7RoImT50YAyv1HeEvgm35RX

  bff:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # host.docker.internal isn't automatically resolvable on Linux the way it is on Docker
    # Desktop (Mac/Windows) - needs this explicit mapping to the host's own gateway IP.
    # Points AiBackend:BaseUrl (bff-config/appsettings.Docker.json.template) at the Merged AI
    # service (sevaone-rag), which runs directly on the host, not as a container in this stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Seva__WebhookSecret: seva-webhook-dev
      CitizenGatewayAuth__Secret: FON2nsJHjslfJw66yYgUTIXKvDjic0KgIRajwAG0Yo
      DeptGatewayAuth__Secret: gm9t0ux0G7RoImT50YAyv1HeEvgm35RX
      DigiLocker__DeptKey: ${DIGILOCKER_DEPT_KEY:?Set DIGILOCKER_DEPT_KEY in docker-deploy/.env}
      DigiLocker__HmacKey: ${DIGILOCKER_HMAC_KEY:?Set DIGILOCKER_HMAC_KEY in docker-deploy/.env}
      ObjectStorage__Endpoint: minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-sevaone}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-sevaone-minio-dev}
      ObjectStorage__Bucket: sevaone-documents
      Wso2CitizenIssuer__ClientId: ${WSO2_CITIZEN_ISSUER_CLIENT_ID:?Set WSO2_CITIZEN_ISSUER_CLIENT_ID in docker-deploy/.env}
      Wso2CitizenIssuer__ClientSecret: ${WSO2_CITIZEN_ISSUER_CLIENT_SECRET:?Set WSO2_CITIZEN_ISSUER_CLIENT_SECRET in docker-deploy/.env}
      Wso2CitizenIssuer__SigningKeyPem: ${WSO2_CITIZEN_ISSUER_SIGNING_KEY_PEM:?Set WSO2_CITIZEN_ISSUER_SIGNING_KEY_PEM in docker-deploy/.env}
      Wso2OperatorIssuer__ClientId: ${WSO2_OPERATOR_ISSUER_CLIENT_ID:?Set WSO2_OPERATOR_ISSUER_CLIENT_ID in docker-deploy/.env}
      Wso2OperatorIssuer__ClientSecret: ${WSO2_OPERATOR_ISSUER_CLIENT_SECRET:?Set WSO2_OPERATOR_ISSUER_CLIENT_SECRET in docker-deploy/.env}
      Wso2GovAdminIssuer__ClientId: ${WSO2_GOVADMIN_ISSUER_CLIENT_ID:?Set WSO2_GOVADMIN_ISSUER_CLIENT_ID in docker-deploy/.env}
      Wso2GovAdminIssuer__ClientSecret: ${WSO2_GOVADMIN_ISSUER_CLIENT_SECRET:?Set WSO2_GOVADMIN_ISSUER_CLIENT_SECRET in docker-deploy/.env}
      Wso2Apim__BaseUrl: https://wso2apim:8243
      # Read-only GPU-host telemetry sidecar, reached through its separate protected tunnel.
      # Override AI_MONITOR_URL when the deployment host uses a different monitor address.
      AiMonitor__BaseUrl: ${AI_MONITOR_URL:-http://host.docker.internal:8010}
      # Government AI assistant (ai-admin) runs on the GPU server and binds to loopback there, so it is
      # reached through an SSH tunnel published on the docker0 gateway, like the monitor above.
      GovAdminAiAssistant__BaseUrl: ${GOV_ADMIN_AI_URL:-http://host.docker.internal:8090}
      AiMonitor__ApiKey: ${AI_MONITOR_API_KEY:-}
      AiMonitor__ApiKeyFile: /run/secrets/ai-monitor.key
      # Optional, unlike the vars above: an empty MobileSevaSms__Username makes bff fall back to
      # LoggedSmsOtpSender (see SevaOne.Infrastructure/DependencyInjection.cs) instead of failing
      # to start, so environments without SMS gateway credentials still work.
      # Lets the status check call a department stand-in on a private network, for local testing only. Keep false.
      TokenIntegration__AllowPrivateStatusHosts: ${TOKEN_INTEGRATION_ALLOW_PRIVATE_STATUS_HOSTS:-false}
      TokenIntegration__EdcsApi__BaseUrl: ${EDCS_API_BASE_URL:-https://sevasindhu.karnataka.gov.in/EP0115_SevaOne_API_UAT/api/TokenIntegration}
      MobileSevaSms__Username: ${MOBILE_SEVA_SMS_USERNAME:-}
      MobileSevaSms__Password: ${MOBILE_SEVA_SMS_PASSWORD:-}
      MobileSevaSms__SenderId: ${MOBILE_SEVA_SMS_SENDER_ID:-}
      MobileSevaSms__SecureKey: ${MOBILE_SEVA_SMS_SECURE_KEY:-}
      MobileSevaSms__TemplateId: ${MOBILE_SEVA_SMS_TEMPLATE_ID:-}
    volumes:
      - ./bff-config/appsettings.Docker.json:/app/appsettings.Docker.json:ro
      - ../docs/secrets/keys/ai-monitor.key:/run/secrets/ai-monitor.key:ro
    ports:
      - "5080:8080"

  # The Karnataka dashboard (legacy/dashboard-kar) used to be a service here. It is
  # deliberately not part of the local stack any more, so it has no service definition.

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Lets the container's nginx (see frontend/nginx.conf's /rag-api/ location) resolve
    # host.docker.internal to reach sevaone-rag, which runs directly on the host machine, not
    # as a container on this network - "host-gateway" is Docker's own special value for this,
    # supported natively since Engine 20.10, no manual IP needed.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bff

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bff
    ports:
      - "5096:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docs/secrets/keys/srikanth-sevaone.rove-lungfish.ts.net.crt:/etc/nginx/certs/sevaone.crt:ro
      - ../docs/secrets/keys/srikanth-sevaone.rove-lungfish.ts.net.key:/etc/nginx/certs/sevaone.key:ro
    depends_on:
      - bff
      - frontend

networks:
  default:
    name: sevaone-net
    external: true
