server {
  listen 80;
  server_name _;

    # Docker's embedded DNS. Upstreams are referenced via variables below so nginx
    # re-resolves per request instead of caching the IP at startup -- otherwise a
    # backend container restarting with a new IP would break routing until nginx
    # itself restarted.
    resolver 127.0.0.11 valid=10s;

    gzip on;

    # Citizen frontend self-hosts all its fonts (frontend/src/styles.css @font-face).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Token-based integration (Seva Sindhu V3), the department-facing URLs. Straight to bff, no APIM:
    # the department's HTTP Basic login is the only credential. nginx adds the stamp bff expects on
    # /api/v1/dept/*, which the department never sees.
    location ~ ^/api/TokenIntegration/(department-update|verify-token)$ {
        set $upstream_bff bff:8080;
        rewrite ^/api/TokenIntegration/(.*)$ /api/v1/dept/token-integration/$1 break;
        proxy_pass http://$upstream_bff;
        proxy_set_header X-SevaOne-Dept-Gateway-Secret "gm9t0ux0G7RoImT50YAyv1HeEvgm35RX";
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 10m;
    }

    # Citizen-facing routes must go through WSO2 APIM's citizen gateway (sevaone-citizen API),
    # not straight to bff -- CitizenGatewayAuthMiddleware rejects anything that skips it. This
    # matcher mirrors CitizenGatewayAuthMiddleware.CitizenPathPrefixes exactly; keep both in sync.
    location ~ ^/api/v1/(auth|me|departments|schemes|search|applications|track|apply) {
        # set must come before rewrite ... break - break halts all further rewrite-module
        # directive processing in this location (set is part of that same module), so a
        # set placed after break never runs and $upstream_apim_gw stays empty, producing
        # "no host in upstream" / 500. Confirmed live (#this session).
        set $upstream_apim_gw wso2apim:8243;
        rewrite ^/(.*)$ /sevaone-citizen/1.0.0/$1 break;
        proxy_pass https://$upstream_apim_gw$uri$is_args$args;
        proxy_ssl_verify off;
    }

    # The operator (assisted/kiosk) routes go through WSO2 APIM's SevaOne-API
    # gateway context, plain-proxied, published with authType=None to match bff's own
    # cookie-based SevaOperator session auth (not a WSO2 OAuth2 token) -- see provision.sh.
    location ~ ^/api/v1/operator/ {
        set $upstream_apim_gw wso2apim:8243;
        rewrite ^/(.*)$ /sevaone/1.0.0/$1 break;
        proxy_pass https://$upstream_apim_gw$uri$is_args$args;
        proxy_ssl_verify off;
    }

    # Department (/api/v1/dept/*) routes go through WSO2 APIM's SevaOne-API gateway context,
    # same as operator/* above -- DeptGatewayAuthMiddleware (bff) rejects any /api/v1/dept/*
    # request that skips APIM, since that's the only thing that stamps
    # X-SevaOne-Dept-Gateway-Secret (see provision.sh, "department gateway-secret stamp").
    # This used to go straight to bff -- see docs/DEPARTMENT_GATEWAY_HARDENING_GAP.md for the
    # rest of that gap (tiers/authType/IP allowlisting), still open.
    location ~ ^/api/v1/dept/ {
        set $upstream_apim_gw wso2apim:8243;
        rewrite ^/(.*)$ /sevaone/1.0.0/$1 break;
        proxy_pass https://$upstream_apim_gw$uri$is_args$args;
        proxy_ssl_verify off;
    }

    # Internal webhooks, health checks, and the dev OTP inbox have their own auth (or none)
    # and never go through an APIM gateway -- straight to bff, same as before.
    location /api/ {
        set $upstream_bff bff:8080;
        proxy_pass http://$upstream_bff;
    }

    # Admin panel, served under a path prefix (built with VITE_BASE=/cmdashboard/).
    location = /cmdashboard { return 301 /cmdashboard/; }
    location /cmdashboard/ {
        set $upstream_admin admin-panel:80;
        rewrite ^/cmdashboard/(.*)$ /$1 break;
        proxy_pass http://$upstream_admin;
    }

    location / {
        set $upstream_frontend frontend:80;
        proxy_pass http://$upstream_frontend;
    }
}

# No :9443 admin-console-proxy block here anymore. wso2is and wso2apim are each reachable
# directly on their own host ports (9443, 9444) - see docker-compose.wso2is.yml and
# docker-compose.wso2apim.yml. Admin consoles are ops-only, not app traffic; routing them
# through the same public-facing nginx as the citizen app added no security value (no auth,
# no rate limiting - just path-splitting for convenience) and only created a host-port
# collision with wso2is. See backend/docs/WSO2_IS_APIM_SETUP.md for the reasoning.
