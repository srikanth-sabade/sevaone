name: sevaone

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sevaone
      POSTGRES_USER: sevaone
      POSTGRES_PASSWORD: sevaone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevaone"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: sevaone-kafkacluster01

  # Object storage for DigiLocker document content (wave 2, M11; storage.py's "minio" backend). Local-dev only: production runs a MinIO
  # binary under supervisord on the GPU box (that host has no Docker), so only S3_ENDPOINT differs between the two, never the code.
  # The API port is reachable only inside sevaone-net (the backend talks to "minio:9000"); the console is bound to loopback only.
  #
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sevaone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sevaone-minio-dev}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9011:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

networks:
  default:
    name: sevaone-net
    ipam:
      config:
        - subnet: 10.99.0.0/24
