name: sevaone-sonarqube

# Standalone SonarQube instance for static analysis of this repo -- independent of the SevaOne
# app stack itself (no shared network/services), matching the same SonarQube deployment already
# running on the KSDC server. Its own dedicated Postgres, not the app's sevaone-postgres-1, to
# keep SonarQube's schema entirely separate from application data.
#
# Host requirement: SonarQube's embedded Elasticsearch needs vm.max_map_count >= 262144 -- set
# via /etc/sysctl.d/99-sonarqube.conf on this host, persists across reboots.
#
# First boot takes a minute or two (Elasticsearch + SonarQube web server initializing). Once up:
#   http://<host>:9000 -- default login admin/admin, you'll be forced to change it on first login.
services:
  sonarqube-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
