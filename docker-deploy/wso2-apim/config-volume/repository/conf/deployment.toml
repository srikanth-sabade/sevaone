password = "admin"
create_admin_account = true

[user_store]
type = "database_unique_id"

# --- seva: fixed encryption key ---
# APIM encrypts sensitive values (e.g. OAuth client secrets it manages) using this
# key before storing them in Postgres. Left unset, APIM auto-generates a random one
# on every boot and writes it back into its own deployment.toml -- harmless while we
# also wipe Postgres on every setup-wso2apim.sh run, but would silently make any
# previously-encrypted data unreadable the moment this ever runs without wiping the
# DB first (setup-wso2apim.sh re-renders deployment.toml from this template every
# time, so a random key would change on every run). Fixed here so the same key
# survives every re-render regardless of restart pattern.
[encryption]
key = "f2188879727f84c1045b2b4b71702285f0c4df772c3761223a8623e4c49ecd99"

# --- seva: Postgres datasources (replaces the default embedded H2) ---
# 3 physical databases, matching the 3 datasources APIM ships by default:
# apim_db (WSO2AM_DB), shared_db (WSO2_SHARED_DB), local (WSO2_CARBON_DB,
# see further down). Schema for each is pre-loaded by
# Docker-deploy/wso2-apim/dbscripts/ before this container ever starts -
# see Docker-deploy/scripts/setup-wso2apim.sh.
[database.apim_db]
type = "postgre"
hostname = "postgres"
port = "5432"
name = "wso2apim_apim"
username = "wso2carbon"
password = "wso2carbon"

[database.shared_db]
type = "postgre"
hostname = "postgres"
port = "5432"
name = "wso2apim_shared"
username = "wso2carbon"
password = "wso2carbon"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

