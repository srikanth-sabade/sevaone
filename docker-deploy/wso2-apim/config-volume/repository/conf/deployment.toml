# --- seva: correct APIM self-referenced login URLs for the Docker port mapping ---
# APIM's Publisher/Devportal/Admin React SPAs self-reference their own OAuth2
# login machinery using this server_url. It defaults to
# https://localhost:${mgt.transport.https.port}, i.e. APIM's *internal*
# container port (9443) -- which is correct for a bare install, but wrong
# here: docker-compose maps that internal 9443 to the host's 9444 (WSO2 IS
# owns host 9443 directly). Left at the default, the SPA's login redirect
# goes to whatever actually answers on host port 9443 (WSO2 IS) instead of
# APIM itself, and IS correctly replies "Cannot find an application
# associated with the given consumer key" since that OAuth app was
# registered in APIM's own database, not IS's.
[apim.idp]
server_url = "https://100.91.197.105:9444"
authorize_endpoint = "https://100.91.197.105:9444/oauth2/authorize"
oidc_logout_endpoint = "https://100.91.197.105:9444/oidc/logout"
oidc_check_session_endpoint = "https://100.91.197.105:9444/oidc/checksession"

# The [apim.idp] block above only fixes the *frontend* (settings.js) values
# the React SPA reads. The actual server-side OAuth2 authorize/login flow is
# built by the underlying Tomcat connector's own idea of "my port",
# independent of [apim.idp] -- confirmed live on the IS side of this same
# bug class: without an equivalent fix, that redirect targets the internal
# 9443 and gets served by the wrong product. proxyPort is Tomcat's own
# standard reverse-proxy setting for "report this port in generated
# redirects instead of the port I'm actually listening on".
[transport.https.properties]
proxyPort = 9444

