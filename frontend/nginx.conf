server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Upstreams below are referenced via variables so nginx resolves
  # them lazily, per-request, instead of at config-load time -- a static `proxy_pass
  # http://host:port` fails the ENTIRE nginx startup with "host not found in upstream" if
  # that host doesn't exist on this environment's network (confirmed live: this crashed the
  # whole frontend container, not just the one feature, when sevaone-rag-service wasn't
  # present on a deployment that never runs the standalone RAG service). With a variable,
  # a missing optional backend just 502s its own path instead of taking down the app.
  resolver 127.0.0.11 valid=10s;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SevaOne AI Discovery backend (ai_backend/) used to be proxied directly from here
  # (location /ai-api/), bypassing the .NET bff entirely -- removed. The frontend now calls
  # the bff's own /api/v1/ai-chat/message and /api/v1/language/asr (see
  # backend/SevaOne.Services/Controllers/AiChatController.cs), which resolves the real
  # logged-in citizen server-side and forwards to ai_backend itself -- ai_backend has no
  # authentication of its own and must never be reachable by a direct client bypass again.
  # Those paths fall through to whatever proxies /api/ to bff already (see the main
  # Docker-deploy/nginx/nginx.conf reverse proxy, not this file).

  # Main AI Discovery (Chat.tsx, this app's "/" route) AND AI Discovery BETA both go through
  # here now - sevaone-rag is a separate project (its own repo folder, own FastAPI process,
  # own vLLM on the GPU box), not run as a container on this compose network at all.
  #
  # Literal gateway IP, not the "host.docker.internal" hostname, despite docker-compose.apps
  # .yml's frontend service adding that extra_hosts entry (which DOES correctly put it in
  # /etc/hosts, confirmed - resolves to 172.17.0.1 here): a variable-based proxy_pass like
  # this one is deliberately resolved through nginx's own `resolver` directive above (Docker's
  # embedded DNS, 127.0.0.11) so a missing optional backend 502s instead of crashing nginx
  # startup - but that resolver only knows Docker service/container names, NOT static
  # /etc/hosts entries, so "host.docker.internal could not be resolved (3: Host not found)"
  # even though the entry is really there. A literal IP address needs no DNS lookup at all,
  # sidestepping the whole resolver-vs-/etc/hosts mismatch.
  #
  # SECURITY NOTE carried over from the previous version of this comment: sevaone-rag has no
  # authentication layer of its own either, same as ai_backend before it - fine for local
  # dev/testing (this whole point/click flow is a dev convenience), but this direct
  # container-to-host proxy should not be how a production deployment reaches it; a real
  # deployment should put an authenticating layer (the bff, or its own gateway) in front,
  # the same reasoning that moved ai_backend behind the bff originally.
  #
  # Optional: an environment where sevaone-rag isn't running on the host just 502s this one
  # path instead of failing nginx startup entirely. LLM replies can take a while, hence the
  # longer read timeout than the default.
  location /rag-api/ {
    # A variable-based proxy_pass (see above) skips nginx's normal automatic prefix
    # replacement entirely and forwards the ORIGINAL request URI unchanged - confirmed live,
    # this proxied /rag-api/chat to sevaone-rag as literally "/rag-api/chat" (404, no such
    # route there) instead of "/api/v1/chat". An explicit rewrite with the "break" flag fixes
    # $uri before proxy_pass (itself given no path, so it forwards $uri as rewritten) sends -
    # `set` MUST come first: `break` halts all further rewrite-module directive processing in
    # this block, `set` included, confirmed live ("using uninitialized upstream_rag_service
    # variable") when it was ordered after the rewrite instead.
    # sevaone-rag runs on the GPU server on port 8000 and is reached directly (no SSH tunnel).
    set $upstream_rag_service 101.53.138.83:8000;
    rewrite ^/rag-api/(.*)$ /api/v1/$1 break;
    proxy_pass http://$upstream_rag_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }
}
